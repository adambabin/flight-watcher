name: GoWild watch

# Cron times are UTC. The script itself decides what to do from the Central time it
# starts at, so each pair below covers both daylight and standard time.
on:
  schedule:
    - cron: "50 4,5 * * *"   # 11:50 PM Central: night watch through 12:15 AM (the other one is a normal check)
    - cron: "5 */3 * * *"    # every 3 hours: check today + tomorrow, answer Telegram commands
    - cron: "5 11 * * *"     # 6:05 AM CDT morning report (12:05 UTC above covers CST)
  workflow_dispatch:
    inputs:
      mode:
        description: "check = setup test, digest = send the morning report now"
        type: choice
        options: [check, tick, digest, night, auto]
        default: check

# One run at a time, so state commits never collide.
concurrency:
  group: flightwatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load state
        run: bash scripts/state.sh pull
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run
        run: python -m flightwatch "${{ inputs.mode || 'auto' }}" --state .state
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        if: always()
        run: bash scripts/state.sh push
        env:
          GH_TOKEN: ${{ github.token }}
